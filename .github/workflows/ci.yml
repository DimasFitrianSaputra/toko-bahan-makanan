name: CI Software Testing

# Workflow berjalan otomatis saat push [cite: 8, 75]
on: [push]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    # Menyiapkan database MySQL untuk testing [cite: 7, 77]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: toko_bahan_makanan_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Install Dependencies (Compile)
        run: composer install --prefer-dist --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: toko_bahan_makanan_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run All Tests (Unit & Integration)
        # Menjalankan semua testing sesuai mandat modul [cite: 71, 77]
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: toko_bahan_makanan_test
          DB_USERNAME: root
          DB_PASSWORD: root